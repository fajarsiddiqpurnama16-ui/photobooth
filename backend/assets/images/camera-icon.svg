<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Camera Body -->
  <rect x="6" y="18" width="52" height="38" rx="10" fill="url(#camGrad)" filter="url(#shadow)" />

  <!-- Top hump / Flash housing -->
  <path d="M 22 18 L 26 11 Q 28 9 32 9 L 32 9 Q 36 9 38 11 L 42 18 Z" fill="url(#camGrad)" />

  <!-- Shutter Button -->
  <rect x="14" y="13" width="7" height="4" rx="2" fill="#f43f5e" />

  <!-- Flash light -->
  <circle cx="47" cy="26" r="3.5" fill="#fef08a" />
  <circle cx="47" cy="26" r="1.5" fill="#ffffff" />

  <!-- Outer Lens Ring -->
  <circle cx="32" cy="37" r="14" fill="#ffffff" opacity="0.9" />
  <circle cx="32" cy="37" r="12" fill="url(#lensGrad)" />
  
  <!-- Inner Lens & Reflection -->
  <circle cx="32" cy="37" r="8" fill="url(#glowGrad)" opacity="0.85" />
  <circle cx="32" cy="37" r="5" fill="#090d16" />
  <circle cx="29" cy="34" r="2.2" fill="#ffffff" opacity="0.9" />
</svg>
